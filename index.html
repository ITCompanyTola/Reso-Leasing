          <li class="body" style="display: flex; gap: 14px"><span class="caps" style="flex: 0 0 auto; width: 30px; font-size: 20px; color: rgb(107, 93, 79)">I</span><span><b style="font-weight: 600">Регистрация в день праздника.</b> Отсканируйте QR-код у входа в банкетный зал или у фотозоны и заполните форму: ФИО, фильм, имя героя.</span></li>
          <li class="body" style="display: flex; gap: 14px"><span class="caps" style="flex: 0 0 auto; width: 30px; font-size: 20px; color: rgb(107, 93, 79)">II</span><span><b style="font-weight: 600">Цельный образ.</b> Одного-двух атрибутов мало. Например, Индиане Джонсу нужна не только шляпа, но и куртка, рубашка и сумка через плечо. Героя должны узнать сразу.</span></li>
          <li class="body" style="display: flex; gap: 14px"><span class="caps" style="flex: none; width: 30px; font-size: 20px; color: #6b5d4f">III</span><span><b style="font-weight: 600">Сцена и голосование.</b> Участники показывают костюм на сцене, лучших выбирают зрители.</span></li>
          <li class="body" style="display: flex; gap: 14px; max-width: 526px"><span class="caps" style="flex: 0 0 auto; width: 30px; font-size: 20px; color: rgb(107, 93, 79)">IV</span><span><b style="font-weight: 600">Три призёра.</b> За 1-е, 2-е и 3-е места - сертификаты Lime.</span></li>
        </ol>
      </div><img loading="lazy" decoding="async" class="prizes-img" src="assets/img/prizes.webp" alt="Призы: подарочные сертификаты Lime за 1, 2 и 3 место" style="width: 100%; max-width: 597px; height: auto">
    </div>
  </section>

  <section id="booking" class="sec dk" aria-labelledby="t-book">
    <div class="torn torn-dk" aria-hidden="true"></div>
    <img loading="lazy" decoding="async" src="assets/img/film-strip.webp" alt="" aria-hidden="true" style="position: absolute; right: -20px; top: 30px; width: 150px">
    <div class="wrap bk-cols">
      <div class="bk-side">
        <p class="caps mutedd" style="font-size: 16px; letter-spacing: .3em">Регистрация до 10.12</p>
        <p class="script gold-text" style="font-size: 96px; color: #E6D3AE; margin-top: 18px">До встречи</p>
        <p class="caps" style="font-size: 30px; line-height: 1.45; letter-spacing: .12em; color: #EFE7DA; margin-top: 12px">на главной премьере<br>уходящего года!</p>
        <img loading="lazy" decoding="async" src="assets/img/film-strip.webp" alt="" aria-hidden="true" style="display: block; width: 240px; margin-top: 36px">
      </div>
      <div>
        <sc-if value="{{showForm}}" hint-placeholder-val="{{ true }}">
          <form class="paper bk-form" data-dc-onsubmit="submit" novalidate style="position: relative; max-width: 460px; margin: 0 auto; color: #2E2721; border-radius: 230px 230px 18px 18px; padding: 80px 32px 38px; box-shadow: 0 20px 50px rgba(0,0,0,.5); display: flex; flex-direction: column; gap: 18px; outline: 1px solid rgba(46,39,33,.25); outline-offset: -10px">
            <div style="text-align: center">
              <h2 id="t-book" class="caps h2">Бронирование мест</h2>
              <p class="body muted" style="font-style: italic; margin-top: 8px">Регистрация до 10.12</p>
            </div>
            <div class="fld">
              <label for="v-fio">Фамилия и имя *</label>
              <input id="v-fio" type="text" autocomplete="name" value="{{form.fio}}" data-dc-onchange="onFio" aria-invalid="{{err.fioInvalid}}" aria-describedby="ve-fio" style="border-bottom-color: {{err.fioBorder}}">
              <sc-if value="{{err.fio}}" hint-placeholder-val="{{ false }}"><span id="ve-fio" class="err" role="alert">{{err.fio}}</span></sc-if>
            </div>
            <div class="fld">
              <label for="v-dept">Департамент *</label>
              <input id="v-dept" type="text" autocomplete="organization-title" value="{{form.dept}}" data-dc-onchange="onDept" aria-invalid="{{err.deptInvalid}}" aria-describedby="ve-dept" style="border-bottom-color: {{err.deptBorder}}">
              <sc-if value="{{err.dept}}" hint-placeholder-val="{{ false }}"><span id="ve-dept" class="err" role="alert">{{err.dept}}</span></sc-if>
            </div>
            <button class="pill" type="submit" data-dc-bool-disabled="sending" style="margin-top: 8px; align-self: center">{{submitLabel}} <span aria-hidden="true">→</span></button>
          </form>
        </sc-if>

        <sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
          <div class="paper ticket-print" role="status" style="position: relative; max-width: 460px; margin: 0 auto; color: #2E2721; border-radius: 6px; padding: 44px 30px 36px; box-shadow: 0 20px 50px rgba(0,0,0,.5); outline: 1px dashed rgba(46,39,33,.4); outline-offset: -12px; text-align: center">
            <img loading="lazy" decoding="async" src="assets/img/wax-seal.svg" alt="" aria-hidden="true" style="position: absolute; left: 50%; top: -34px; width: 72px; transform: translateX(-50%)">
            <p class="caps" style="font-size: 15px; color: #6b5d4f; letter-spacing: .3em">Admit one · Билет на премьеру</p>
            <p class="script" style="font-size: 44px; margin-top: 16px">Ваше место забронировано!</p>
            <p class="body" style="margin-top: 14px">До встречи 23 декабря</p>
            <div style="margin-top: 20px; padding-top: 16px; border-top: 1px solid rgba(46,39,33,.25); display: flex; flex-direction: column; gap: 2px">
              <span class="body" style="font-size: 17px">Гость: <b>{{guestName}}</b></span>
              <span class="body" style="font-size: 17px">Департамент: {{guestDept}}</span>
              <span class="body muted" style="font-size: 17px">17:00 · Triumph Event Hall</span>
            </div>
          </div>
          <div class="confetti" aria-hidden="true"><sc-for list="{{confetti}}" as="c" hint-placeholder-count="0"><i style="left: {{c.l}}; width: {{c.w}}; height: {{c.h}}; background: {{c.bg}}; animation-delay: {{c.d}}; animation-duration: {{c.u}}; --r: {{c.r}}"></i></sc-for></div>
        </sc-if>
      </div>
    </div>
  </section>

  <!-- 7 · ОТСЧЁТ + ФИНАЛ -->
  <section class="sec cr" aria-label="До премьеры">
    <div class="torn torn-cr" aria-hidden="true"></div>
    <div class="cd-arch bulbs" style="max-width: 560px; margin: 0 auto; border: 1px solid rgba(46,39,33,.3); border-bottom: 0; border-radius: 280px 280px 0 0; padding: 60px 16px 28px">
      <sc-if value="{{cd.running}}" hint-placeholder-val="{{ true }}">
        <h2 class="caps h2">Осталось</h2>
        <div class="cd" role="timer" aria-live="off" style="margin-top: 18px">
          <div><div class="cdn">{{cd.d}}</div><div class="cdl">{{cd.dl}}</div></div><div class="cdn" aria-hidden="true">:</div>
          <div><div class="cdn">{{cd.h}}</div><div class="cdl">{{cd.hl}}</div></div><div class="cdn" aria-hidden="true">:</div>
          <div><div class="cdn">{{cd.m}}</div><div class="cdl">минут</div></div><div class="cdn" aria-hidden="true">:</div>
          <div><div class="cdn">{{cd.s}}</div><div class="cdl">секунд</div></div>
        </div>
      </sc-if>
      <sc-if value="{{cd.over}}" hint-placeholder-val="{{ false }}"><p class="script" style="font-size: 40px">Премьера уже идёт!</p></sc-if>
    </div>
    <div class="markdiv" aria-hidden="true"><span></span><img loading="lazy" decoding="async" src="assets/img/ornament-ink.png" alt=""><span></span></div>
    <div class="mob">
      <p class="script" style="font-size: clamp(42px, 11.5vw, 58px); margin-top: 18px">До встречи</p>
      <p class="caps" style="font-size: 18px; line-height: 1.6; margin-top: 10px">на главной премьере<br>уходящего года!</p>
    </div>
  </section>

  <footer class="dk" style="position: relative; padding: 54px 28px 40px; text-align: center; font-size: 15px; line-height: 1.7; color: #CFC3B1">
    <div class="torn torn-dk" aria-hidden="true"></div>
    <button class="egg" type="button" data-dc-onclick="eggOn" aria-label="Новогодний сюрприз"><img loading="lazy" decoding="async" src="assets/img/ornament-cream.png" alt=""></button>
    <div class="credits-wrap" role="group" aria-label="Финальные титры">
      <div class="credits">
        <span class="r">Представляет</span><span class="n">RESO-LEASING PICTURES</span>
        <span class="r">В главных ролях</span><span class="n">вся команда РЕСО-Лизинг</span>
        <span class="r">Хронометраж</span><span class="n">один незабываемый вечер</span>
        <span class="r">В прокате</span><span class="n">с 2003 года</span>
      </div>
    </div>
    <p style="margin: 0">© РЕСО-Лизинг, 2026</p>
    
    
  </footer>
</main>
<sc-if value="{{boulder}}" hint-placeholder-val="{{ false }}"><div class="boulder" aria-hidden="true"></div></sc-if>
</div>
</template>
<noscript><p style="color:#EFE7DA;text-align:center;padding:40px;font-family:Georgia,serif">Для просмотра приглашения включите JavaScript.</p></noscript>
</body>
</html>
